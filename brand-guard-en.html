<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101C2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Brand Guard — حارس العلامة</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F5F7; --card:#FFFFFF; --ink:#101C2C; --ink2:#4A5868; --line:#DDE3E9;
  --brand:#0F5C7A; --brand-ink:#FFFFFF; --warn:#B7791F; --bad:#C53030; --ok:#2F855A;
  --radius:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'IBM Plex Sans Arabic',Tahoma,system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #F2A541;outline-offset:2px}
.app{max-width:680px;margin:0 auto;padding-bottom:150px;min-height:100vh}
header.top{background:var(--ink);color:#fff;padding:16px 18px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px}
header.top h1{margin:0;font-size:21px;font-weight:700}
header.top p{margin:2px 0 0;color:#B9C6D3;font-size:13px}
.top-brand{display:flex;align-items:center;gap:12px}
.top-brand img.kt-logo{height:44px;width:auto;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45))}
.top-acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kt-footer{margin:28px auto 12px;padding:14px 16px;text-align:center;color:var(--ink2);font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:.92}
.kt-footer .kt-pill{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:#F2A541;padding:6px 16px;border-radius:999px;font-weight:700;font-size:12px;letter-spacing:.6px;box-shadow:0 4px 12px rgba(16,28,44,.15);border:1px solid #2D3F54}
.kt-footer .kt-pill img{height:26px;width:auto;object-fit:contain}
.kt-bg-mark{position:fixed;bottom:74px;inset-inline-start:14px;z-index:15;pointer-events:none;opacity:.14;width:90px;height:auto}
.pill{border:1px solid #3B4B5E;background:#1A2B40;color:#fff;border-radius:999px;padding:4px 11px;min-height:34px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.pill.staff{border-color:#F2A541;color:#F2A541}
.pill.sync{border-color:#2F855A;color:#9AE6B4}
.pad{padding:16px 16px 0}
.notice{background:#FFF6E0;border:1px solid #F0D595;border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.notice.danger{background:#FFF5F5;border-color:#FEB2B2}
.notice span{font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;min-height:40px;cursor:pointer;font-size:14px;display:flex;gap:6px;align-items:center}
.chip b{font-weight:700}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.alert{border-color:var(--bad);color:var(--bad)}
.chip.alert[aria-pressed=true]{background:var(--bad);color:#fff}
input[type=text],input[type=url],input[type=email],input[type=search],input[type=password],select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:12px 14px;min-height:48px}
textarea{min-height:110px;resize:vertical}
label{display:block;font-weight:500;margin:16px 0 6px;font-size:15px}
.chk{display:flex;align-items:center;gap:8px;font-weight:500;margin:10px 0;font-size:14px;cursor:pointer}
.chk input{width:20px;height:20px;flex:0 0 20px}
.hint{color:var(--ink2);font-size:13px;margin:4px 0 0}
.ltr{direction:ltr;unicode-bidi:isolate;text-align:left}
.case{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px;width:100%;text-align:start;cursor:pointer}
.case:hover{border-color:#B8C4D0}
.pf{flex:0 0 44px;height:44px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;direction:ltr}
.case .meta{flex:1;min-width:0}
.case .u{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.case .d{font-size:13px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.stamp{--c:#555;border:2px solid var(--c);color:var(--c);padding:1px 9px;border-radius:4px;font-weight:700;font-size:13px;transform:rotate(-2.5deg);white-space:nowrap;display:inline-block;background:#fff}
.late{display:inline-block;margin-inline-start:4px;background:var(--bad);color:#fff;border-radius:4px;font-size:12px;padding:0 7px;font-weight:700}
.tag{display:inline-block;border-radius:4px;font-size:11px;padding:0 7px;font-weight:700;background:#EBF8FF;color:#2B6CB0;border:1px solid #BEE3F8}
.tag.down{background:#F0FFF4;color:#276749;border-color:#C6F6D5}
.tag.live{background:#FFF5F5;color:#9B2C2C;border-color:#FED7D7}
.tag.ref{background:#FAF5FF;color:#553C9A;border-color:#E9D8FD}
.empty{text-align:center;color:var(--ink2);padding:44px 20px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
nav.bar{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav.bar .in{display:flex;width:100%;max-width:680px}
nav.bar button{flex:1;border:0;background:none;padding:12px 4px;min-height:56px;font-size:14px;color:var(--ink2);cursor:pointer}
nav.bar button[aria-current=page]{color:var(--brand);font-weight:700;box-shadow:inset 0 3px 0 var(--brand)}
.fab{position:fixed;inset-inline-end:16px;bottom:78px;z-index:31;background:var(--brand);color:#fff;border:0;border-radius:999px;padding:0 22px;min-height:56px;font-weight:700;font-size:17px;box-shadow:0 6px 18px rgba(16,28,44,.28);cursor:pointer}
.btn{border:1px solid var(--ink);background:#fff;border-radius:var(--radius);padding:0 18px;min-height:48px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:inherit;text-align:center}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.warn{background:#FFF5F5;border-color:var(--bad);color:var(--bad);font-weight:700}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.sheet{position:fixed;inset:0;background:var(--paper);z-index:50;overflow-y:auto}
.sheet .head{background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px;position:sticky;top:0;z-index:2}
.sheet .head h2{margin:0;font-size:18px;flex:1}
.sheet .head button{background:none;border:1px solid #3B4B5E;color:#fff;border-radius:8px;min-height:40px;padding:0 14px;cursor:pointer}
.sheet .body{max-width:680px;margin:0 auto;padding:6px 16px 120px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-top:14px}
.panel h3{margin:0 0 8px;font-size:16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pad>.panel:first-child{margin-top:0}
.steps{display:flex;flex-wrap:wrap;gap:8px}
.step{flex:1 1 30%;min-height:46px;border:1.5px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:14px;padding:4px 6px}
.step[aria-pressed=true]{border-color:var(--c);color:var(--c);font-weight:700;box-shadow:inset 0 0 0 1px var(--c)}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shot{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#fff;padding:0;cursor:pointer}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .x{position:absolute;top:4px;inset-inline-start:4px;background:#000c;color:#fff;border:0;border-radius:6px;width:28px;height:28px;cursor:pointer}
.log{list-style:none;margin:0;padding:0;font-size:14px;color:var(--ink2)}
.log li{padding:6px 0;border-bottom:1px dashed var(--line)}
.log li:last-child{border:0}
.var{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.var:last-child{border:0}
.var .n{flex:1;font-weight:500;min-width:120px}
.var.done .n{text-decoration:line-through;color:var(--ink2)}
.var a,.var .mini{font-size:13px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;color:var(--brand);text-decoration:none;min-height:34px;display:inline-flex;align-items:center;cursor:pointer}
.var .mini.bad{border-color:var(--bad);color:var(--bad);font-weight:700}
.var input[type=checkbox]{flex:0 0 22px;width:22px;height:22px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin:8px 0;background:var(--paper);padding:10px;border-radius:8px}
.kv b{color:var(--ink2)}
.esc-group{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.esc-group:first-of-type{margin-top:6px;padding-top:0;border-top:0}
.esc-group h4{margin:0 0 6px;font-size:13px;color:var(--ink2)}
#lightbox{position:fixed;inset:0;background:#000d;z-index:80;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
#lightbox img{max-width:100%;max-height:80vh;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#lightbox .lb-bar{display:flex;gap:10px}
#toast{position:fixed;bottom:90px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:90;display:none;font-size:15px}
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block!important;font-size:12px}
  #print h1{font-size:20px} #print .pc{border:1px solid #999;padding:10px;margin:0 0 12px;page-break-inside:avoid}
  #print img{max-width:48%;max-height:260px;margin:4px;border:1px solid #bbb}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-brand">
      <img class="kt-logo" id="ktTopLogo" alt="Kais Tauiti Logo">
      <div><h1 id="appTitle">حارس العلامة</h1><p id="sub"></p></div>
    </div>
    <div class="top-acts" id="topActs"></div>
  </header>
  <main id="main"></main>
  <footer class="kt-footer">
    <div class="kt-pill"><img id="ktFootLogo" alt="KT"><span>POWERED BY KAIS</span></div>
  </footer>
</div>
<img class="kt-bg-mark" id="ktBgLogo" alt="">
<button class="fab" id="fabAdd" data-act="openAdd">+ إضافة حالة</button>
<nav class="bar" id="navBar"><div class="in">
  <button data-act="tab" data-v="list" id="t-list">الحالات</button>
  <button data-act="tab" data-v="variants" id="t-variants">الفحص</button>
  <button data-act="tab" data-v="settings" id="t-settings">الإعدادات</button>
</div></nav>
<div id="sheet" class="sheet" hidden></div>
<div id="lightbox" data-act="closeLight">
  <img alt="">
  <div class="lb-bar">
    <button class="btn sm primary" data-act="downloadLightImg" id="lbDownBtn">تحميل الصورة</button>
    <button class="btn sm" data-act="closeLight" id="lbCloseBtn">إغلاق</button>
  </div>
</div>
<div id="toast" role="status"></div>
<div id="print"></div>
<input type="file" id="importFile" accept="application/json" hidden>

/* ---------- storage ---------- */
const DB={
 db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('hares-alalama',1);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('cases'))d.createObjectStore('cases',{keyPath:'id'});if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'key'})};
  r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
 run(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const rq=fn(t.objectStore(store));
  t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error)})},
 all(s){return this.run(s,'readonly',o=>o.getAll())},
 get(s,k){return this.run(s,'readonly',o=>o.get(k))},
 put(s,v){return this.run(s,'readwrite',o=>o.put(v))},
 del(s,k){return this.run(s,'readwrite',o=>o.delete(k))},
 clear(s){return this.run(s,'readwrite',o=>o.clear())}
};

  if(uUrl&&uKey)return{url:uUrl.replace(/\/$/,''),key:uKey,workspace:uWs||'default'};
  try{const raw=localStorage.getItem('hares-cloud');if(!raw)return null;const cfg=JSON.parse(raw);if(cfg&&cfg.url&&cfg.key)return{url:cfg.url.replace(/\/$/,''),key:cfg.key,workspace:cfg.workspace||'default'}}catch{}
  return null;
 },
 saveConfig(url,key,workspace){
  if(!url||!key){localStorage.removeItem('hares-cloud');return null}
  const cfg={url:url.trim().replace(/\/$/,''),key:key.trim(),workspace:(workspace||'default').trim()||'default'};
  localStorage.setItem('hares-cloud',JSON.stringify(cfg));return cfg;
 },
 headers(cfg,extra={}){
  return Object.assign({'apikey':cfg.key,'Authorization':'Bearer '+cfg.key,'Content-Type':'application/json'},extra);
 },
 async pushCase(c){
  const cfg=this.getConfig();if(!cfg)return false;
  const r=await fetch(`${cfg.url}/rest/v1/hares_cases`,{
   method:'POST',
   headers:this.headers(cfg,{'Prefer':'resolution=merge-duplicates'}),
   body:JSON.stringify({id:c.id,workspace:cfg.workspace,data:c,updated_at:c.updatedAt||Date.now()})
  });
  return r.ok;
 },
 async deleteRemoteCase(id){
  const cfg=this.getConfig();if(!cfg)return false;
  const r=await fetch(`${cfg.url}/rest/v1/hares_cases?id=eq.${encodeURIComponent(id)}&workspace=eq.${encodeURIComponent(cfg.workspace)}`,{
   method:'DELETE',headers:this.headers(cfg)
  });
  return r.ok;
 },
 async syncAll(silent=false){
  const cfg=this.getConfig();if(!cfg){if(!silent)toast(tr('أدخل بيانات Supabase أولاً','Enter Supabase credentials first'));return false}
  state.syncing=true;renderTopActs();
  try{
   const rc=await fetch(`${cfg.url}/rest/v1/hares_cases?workspace=eq.${encodeURIComponent(cfg.workspace)}&select=id,data,updated_at`,{headers:this.headers(cfg)});
   if(!rc.ok)throw new Error('HTTP '+rc.status);
   const remoteCases=await rc.json();
   const rMap=new Map(remoteCases.map(row=>[row.id,row]));
   const lMap=new Map(state.cases.map(c=>[c.id,c]));
   const toPush=[];
   for(const [id,lc] of lMap){
    const rem=rMap.get(id);
    if(!rem||(lc.updatedAt||0)>(rem.updated_at||0))toPush.push({id,workspace:cfg.workspace,data:lc,updated_at:lc.updatedAt||Date.now()});
   }
   for(const [id,rem] of rMap){
    const lc=lMap.get(id);
    if(rem.data&&(!lc||(rem.updated_at||0)>(lc.updatedAt||0))){await DB.put('cases',rem.data)}
   }
   if(toPush.length){
    await fetch(`${cfg.url}/rest/v1/hares_cases`,{
     method:'POST',headers:this.headers(cfg,{'Prefer':'resolution=merge-duplicates'}),body:JSON.stringify(toPush)
    });
   }
   const rs=await fetch(`${cfg.url}/rest/v1/hares_settings?workspace=eq.${encodeURIComponent(cfg.workspace)}&select=data,updated_at`,{headers:this.headers(cfg)});
   if(rs.ok){
    const sRows=await rs.json();
    const remS=sRows[0];
    const locUpdated=state.settings.updatedAt||0;
    if(remS&&remS.data&&(remS.updated_at||0)>locUpdated){
     state.settings=Object.assign({remind:7},remS.data);
     await DB.put('settings',{key:'main',value:state.settings});
    }else if(state.settings.brand){
     await fetch(`${cfg.url}/rest/v1/hares_settings`,{
      method:'POST',headers:this.headers(cfg,{'Prefer':'resolution=merge-duplicates'}),
      body:JSON.stringify({workspace:cfg.workspace,data:state.settings,updated_at:locUpdated||Date.now()})
     });
    }
   }
   state.cases=await DB.all('cases');
   state.lastSync=Date.now();
   if(!silent)toast(tr('تمت المزامنة السحابية بنجاح','Cloud sync completed'));
   return true;
  }catch(err){
   if(!silent)toast(tr('تعذّرت المزامنة: تحقق من الرابط والمفتاح وجداول Supabase','Sync failed: check Supabase URL, Key & tables'));
   return false;
  }finally{
   state.syncing=false;renderTopActs();if(!state.customerMode)renderMain();
  }
 }
};

/* ---------- URL parsing ---------- */
function parseUrl(raw){
 raw=(raw||'').trim();if(!raw)return{platform:'other',username:''};
 let u;try{u=new URL(/^https?:\/\//i.test(raw)?raw:'https://'+raw)}catch{return{platform:'other',username:raw.replace(/^@/,'')}}
 const h=u.hostname.replace(/^(www|m|web|mobile)\./,''),p=u.pathname.split('/').filter(Boolean);
 const clean=s=>decodeURIComponent(s||'').replace(/^@/,'');
 if(h.endsWith('instagram.com')){const bad=['p','reel','reels','explore','stories','tv'];return{platform:'instagram',username:bad.includes(p[0])?'':clean(p[0])}}
 if(h.endsWith('tiktok.com'))return{platform:'tiktok',username:clean(p.find(x=>x.startsWith('@')))}
 if(h.endsWith('facebook.com')||h.endsWith('fb.com')||h==='fb.me'){const id=u.searchParams.get('id');return{platform:'facebook',username:p[0]==='profile.php'?(id||''):clean(p[0])}}
 if(h==='x.com'||h.endsWith('twitter.com'))return{platform:'x',username:clean(p[0])}
 if(h.endsWith('snapchat.com'))return{platform:'snapchat',username:clean(p[0]==='add'?p[1]:p[0])}
 if(h.endsWith('youtube.com')||h==='youtu.be')return{platform:'youtube',username:clean(p.find(x=>x.startsWith('@'))||p[1])}
 if(h==='t.me'||h.endsWith('telegram.me'))return{platform:'telegram',username:clean(p[0])}
 if(h==='wa.me'||h.endsWith('whatsapp.com'))return{platform:'whatsapp',username:clean(p[0])}
 return{platform:'other',username:''}
}

/* ---------- username & domain variations ---------- */
function variants(handle){
 const h=(handle||'').toLowerCase().replace(/^@/,'').trim();if(h.length<2)return[];
 const set=new Set();
 ['official','_official','.official','_uae','.uae','uae','_ae','ae','shop','_shop','store','_store','1','_1','2','_','real','_real'].forEach(s=>set.add(h+s));
 ['official_','real_','_','the.','the_'].forEach(p=>set.add(p+h));
 if(h.length>3){const m=Math.floor(h.length/2);[m-1,m,m+1].forEach(i=>{if(i>0&&i<h.length){set.add(h.slice(0,i)+'_'+h.slice(i));set.add(h.slice(0,i)+'.'+h.slice(i))}})}
 set.add(h+h.slice(-1));
 const v=h.search(/[aeiou]/);if(v>=0)set.add(h.slice(0,v+1)+h[v]+h.slice(v+1));
 [['o','0'],['i','l'],['l','1'],['a','4'],['s','5'],['e','3']].forEach(([a,b])=>{if(h.includes(a))set.add(h.split(a).join(b))});
 set.delete(h);return[...set].filter(x=>/^[a-z0-9._]{3,30}$/.test(x)).slice(0,45);
}

function domainVariants(rawDomain){
 let d=(rawDomain||'').toLowerCase().trim().replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0];
 if(!d)return[];
 const parts=d.split('.');
 const name=parts[0].replace(/[^a-z0-9-]/g,'');
 const origTld=parts.slice(1).join('.')||'com';
 if(name.length<2)return[];
 const set=new Set();
 const tlds=['com','net','org','shop','store','ae','online','co'];
 tlds.forEach(t=>{if(t!==origTld)set.add(`${name}.${t}`)});
 ['-shop','-store','-official','-ae','-uae','shop','store','official'].forEach(s=>set.add(`${name}${s}.${origTld}`));
 ['official-','real-','my-','get-'].forEach(p=>set.add(`${p}${name}.${origTld}`));
 for(let i=0;i<name.length;i++){
  if(name.length>3)set.add(name.slice(0,i)+name.slice(i+1)+'.'+origTld);
  if(i<name.length-1&&name[i]!==name[i+1]){
   set.add(name.slice(0,i)+name[i+1]+name[i]+name.slice(i+2)+'.'+origTld);
  }
 }
 [['o','0'],['l','1'],['i','l'],['e','3'],['a','4'],['s','5']].forEach(([a,b])=>{
  if(name.includes(a))set.add(name.split(a).join(b)+'.'+origTld);
 });
 set.delete(`${name}.${origTld}`);
 return [...set].filter(x=>/^[a-z0-9-]{2,40}\.[a-z.]{2,12}$/.test(x)).slice(0,28);
}

/* ---------- DNS, Link & RDAP Whois Checking ---------- */
async function checkDomainDns(domain){
 try{
  const r=await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(domain)}&type=A`,{
   headers:{'Accept':'application/dns-json'}
  });
  if(!r.ok)return{state:'unknown',ip:''};
  const j=await r.json();
  if(j.Status===0&&Array.isArray(j.Answer)&&j.Answer.length>0){
   const a=j.Answer.find(x=>x.type===1)||j.Answer[0];
   return{state:'registered',ip:a.data||tr('مسجّل','Registered')};
  }
  if(j.Status===3)return{state:'free',ip:''};
  return{state:'free',ip:''};
 }catch{
  return{state:'unknown',ip:''};
 }
}

 if(!raw)return{at:Date.now(),state:'unknown',detail:tr('لا يوجد رابط لفحصه','No URL to check')};

async function fetchDomainRdap(domain){
 const clean=domain.replace(/^www\./,'').trim();
 if(!clean||!clean.includes('.'))return null;
 try{
  const r=await fetch(`https://rdap.org/domain/${encodeURIComponent(clean)}`,{headers:{'Accept':'application/rdap+json, application/json'}});
  if(!r.ok)return null;
  const j=await r.json();
  let registrar='',abuseEmail='',created='';
  const walkEntities=ents=>{
   if(!Array.isArray(ents))return;
   for(const e of ents){
    const roles=e.roles||[];
    const vcard=Array.isArray(e.vcardArray)&&Array.isArray(e.vcardArray[1])?e.vcardArray[1]:[];
    const fn=vcard.find(x=>x[0]==='fn');
    const em=vcard.find(x=>x[0]==='email');
    if(roles.includes('registrar')&&fn&&fn[3]&&!registrar)registrar=String(fn[3]);
    if(roles.includes('abuse')&&em&&em[3]&&!abuseEmail)abuseEmail=String(em[3]);
    if(!abuseEmail&&em&&em[3])abuseEmail=String(em[3]);
    if(e.entities)walkEntities(e.entities);
   }
  };
  walkEntities(j.entities);
  if(Array.isArray(j.events)){
   const regEv=j.events.find(ev=>ev.eventAction==='registration')||j.events[0];
   if(regEv&&regEv.eventDate)created=regEv.eventDate.slice(0,10);
  }
  const nameservers=Array.isArray(j.nameservers)?j.nameservers.map(n=>n.ldhName).filter(Boolean).slice(0,4):[];
  return{
   at:Date.now(),
   domain:clean,
   registrar:registrar||'Unknown Registrar',
   abuseEmail:abuseEmail||'',
   created:created||'',
   nameservers
  };
 }catch{
  return null;
 }
}

/* ---------- Image Compression & Forensic Evidence Stamp ---------- */
function compress(file,stampInfo=null){
 return new Promise((res,rej)=>{
  const r=new FileReader();r.onerror=rej;
  r.onload=()=>{
   const im=new Image();im.onerror=rej;
   im.onload=()=>{
    const m=1280,k=Math.min(1,m/Math.max(im.width,im.height));
    const w=Math.max(360,Math.round(im.width*k)),h=Math.round(im.height*k);
    const barH=stampInfo?36:0;
    const cv=document.createElement('canvas');
    cv.width=w;cv.height=h+barH;
    const ctx=cv.getContext('2d');
    ctx.fillStyle='#101C2C';
    ctx.fillRect(0,0,w,h+barH);
    ctx.drawImage(im,0,0,w,h);
    if(stampInfo){
     ctx.fillStyle='#101C2C';
     ctx.fillRect(0,h,w,barH);
     ctx.fillStyle='#F2A541';
     ctx.fillRect(0,h,w,2);
     ctx.fillStyle='#FFFFFF';
     ctx.font='bold 12px Tahoma, system-ui, sans-serif';
     ctx.textBaseline='middle';
     const ts=new Date().toISOString().replace('T',' ').slice(0,19)+' UTC';
     const txt=`EVIDENCE • ${ts} • Target: ${stampInfo.target||'N/A'} • Powered by Kais`;
     if(kaisImg.complete&&kaisImg.naturalWidth){
      const lh=barH-6,lw=Math.round(kaisImg.naturalWidth*(lh/kaisImg.naturalHeight));
      ctx.drawImage(kaisImg,w-lw-8,h+3,lw,lh);
     }
     ctx.fillText(txt.slice(0,105),10,h+barH/2+1);
    }
    res(cv.toDataURL('image/jpeg',.82));
   };
   im.src=r.result;
  };
  r.readAsDataURL(file);
 });
}

 bg.addColorStop(1,'#182B44');
 ctx.fillStyle=bg;
 ctx.fillRect(0,0,1080,1920);

 // Top hazard stripe
 ctx.fillStyle='#C53030';
 ctx.fillRect(0,0,1080,170);
 ctx.fillStyle='#FFFFFF';
 ctx.textAlign='center';

 ctx.fillText('⚠️ تحذير هام للعملاء • SCAM ALERT',540,105);

 // Brand title
 ctx.fillStyle='#F2A541';
 ctx.font='bold 64px Tahoma, sans-serif';
 ctx.fillText(brand,540,290);
 ctx.fillStyle='#B9C6D3';
 ctx.font='34px Tahoma, sans-serif';
 ctx.fillText(tr('تنبيه رسمي لحماية العملاء من انتحال الهوية','Official Brand Protection & Anti-Impersonation Notice'),540,355);

 // Red Fake Impersonator Card
 ctx.fillStyle='#2B1419';
 ctx.strokeStyle='#E53E3E';
 ctx.lineWidth=6;
 ctx.beginPath();
 ctx.roundRect(70,430,940,560,28);
 ctx.fill();ctx.stroke();

 ctx.fillStyle='#FEB2B2';
 ctx.font='bold 40px Tahoma, sans-serif';
 ctx.fillText(tr('❌ حساب / موقع منتحل (غير تابع لنا)','❌ FAKE / UNAUTHORIZED IMPERSONATOR'),540,515);

 ctx.fillStyle='#FFFFFF';
 ctx.font='bold 56px Tahoma, sans-serif';
 const targetLabel=idLabel(c);
 ctx.fillText(targetLabel.slice(0,32),540,625);

 ctx.fillStyle='#CBD5E0';
 ctx.font='34px Tahoma, sans-serif';
 const pfText=`${typeInfo(typeOf(c)).t} • ${pfName(c.platform)}`;
 ctx.fillText(pfText,540,695);

 if(c.url){
  ctx.fillStyle='#FBD38D';
  ctx.font='28px Tahoma, sans-serif';
  ctx.fillText(c.url.slice(0,55),540,760);
 }

 // Stamp inside Red Box
 ctx.save();
 ctx.translate(540,885);
 ctx.rotate(-0.04);
 ctx.strokeStyle='#FC8181';
 ctx.lineWidth=5;
 ctx.strokeRect(-320,-50,640,96);
 ctx.fillStyle='#FC8181';
 ctx.font='bold 38px Tahoma, sans-serif';
 ctx.fillText('FAKE / حساب وهمي منتحل',0,13);
 ctx.restore();

 // Green Verified Official Channels Card
 ctx.fillStyle='#0F2922';
 ctx.strokeStyle='#38A169';
 ctx.lineWidth=6;
 ctx.beginPath();
 ctx.roundRect(70,1060,940,580,28);
 ctx.fill();ctx.stroke();

 ctx.fillStyle='#9AE6B4';
 ctx.font='bold 40px Tahoma, sans-serif';
 ctx.fillText(tr('✅ قنواتنا الرسمية المعتمدة فقط','✅ OUR ONLY VERIFIED OFFICIAL CHANNELS'),540,1145);

 ctx.fillStyle='#FFFFFF';
 ctx.font='36px Tahoma, sans-serif';
 const offLines=[];
 const seenOff=new Set();
 const pushOff=(icon,raw)=>{
  const clean=raw.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,'');
  if(!clean||seenOff.has(clean.toLowerCase()))return;
  seenOff.add(clean.toLowerCase());
  offLines.push(icon?`${icon} ${clean}`:clean);
 };
 if(s.domain)pushOff('🌐',s.domain);
 if(s.handles)pushOff('📱','@'+s.handles.split(/[,،\s]+/)[0].replace(/^@/,''));
 (s.official||'').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,4).forEach(u=>pushOff('',u));
 if(!offLines.length)offLines.push(brand);
 offLines.slice(0,5).forEach((line,idx)=>{
  ctx.fillText(line.slice(0,46),540,1235+(idx*72));
 });

 // Bottom warning footer & Powered by Kais signature
 ctx.fillStyle='#E2E8F0';
 ctx.font='bold 31px Tahoma, sans-serif';
 ctx.fillText(tr('لا تقم بتحويل أي مبالغ مالية أو مشاركة بياناتك مع الحسابات المنتحلة','Never send money or share personal data with unauthorized accounts'),540,1710);
 if(kaisImg.complete&&kaisImg.naturalWidth){
  const lw=140,lh=Math.round(kaisImg.naturalHeight*(lw/kaisImg.naturalWidth));
  ctx.drawImage(kaisImg,540-lw/2,1738,lw,lh);
 }
 ctx.fillStyle='#F2A541';
 ctx.font='bold 24px Tahoma, sans-serif';
 ctx.fillText(`POWERED BY KAIS • Brand Guard (حارس العلامة) • ${new Date().toISOString().slice(0,10)}`,540,1875);

 return cv.toDataURL('image/png');
}

function renderVariants(){

 const brand=state.settings.brand||'';
 const domain=state.settings.domain||(handles[0]?handles[0]+'.com':'');
 const images=(state.settings.images||'').split('\n').map(x=>x.trim()).filter(Boolean);
 let h=`<div class="pad">`;
 if(!handles.length&&!brand&&!images.length&&!domain){h+=`<div class="empty"><b>${tr('أضف بيانات العلامة أولاً','Add your brand details first')}</b>${tr('اكتب اسم العلامة واسم حسابها ونطاقها وروابط صور منتجاتك في الإعدادات ثم ارجع هنا.','Enter your brand name, official handle, domain, and product image URLs in Settings, then return here.')}<div style="margin-top:14px;display:flex;gap:8px;justify-content:center"><button class="btn primary" data-act="tab" data-v="settings">${tr('فتح الإعدادات','Open Settings')}</button><button class="btn" data-act="loadDemoPreset">${tr('تحميل عرض تجريبي','Load Demo Preset')}</button></div></div></div>`;$('main').innerHTML=h;return}

 const terms=[...new Set([brand,...handles].filter(Boolean))];
 if(terms.length){
  const lib=(t,cc)=>`https://www.facebook.com/ads/library/?active_status=all&ad_type=all&country=${cc}&q=${encodeURIComponent(t)}&search_type=keyword_unordered&media_type=all`;

  terms.map(t=>`<div class="var"><span class="n ltr">${esc(t)}</span>${link(lib(t,'AE'),tr('الإمارات','UAE'))}${link(lib(t,'SA'),tr('السعودية','KSA'))}${link(lib(t,'ALL'),tr('كل الدول','All Countries'))}</div>`).join('')+`</div>`}
 if(domain){
  const dVars=domainVariants(domain);

  dVars.map(d=>{
   const r=state.dnsResults[d];
   const badge=r?(r.state==='registered'?`<span class="tag live">${tr('مسجّل','Registered')} (${esc(r.ip)})</span>`:(r.state==='free'?`<span class="tag down">${tr('غير مسجّل','Unregistered')}</span>`:`<span class="hint">${tr('تعذّر الفحص','Check failed')}</span>`)):'';

  }).join('')+`</div>`;
 }
 if(images.length){

 if(brand){const q=encodeURIComponent('"'+brand+'"');
  h+=`<div class="panel"><h3>${tr('بحث سريع عن الاسم','Quick Brand Search')}</h3><p class="hint" style="margin-bottom:10px">${tr('يفتح البحث في جوجل داخل كل منصة. افتحها مرة في الأسبوع.','Searches Google within each social platform. Run once a week.')}</p><div class="row">`+

 handles.forEach(hd=>{const vs=variants(hd);

  vs.map(v=>{const done=state.checked.includes(v);return `<div class="var ${done?'done':''}"><input type="checkbox" data-act="toggleVar" data-v="${esc(v)}" ${done?'checked':''} aria-label="${tr('تم فحص','Checked')} ${esc(v)}"><span class="n ltr">${esc(v)}</span>

 h+=`</div>`;$('main').innerHTML=h;
}

/* ---------- sheets ---------- */
function openSheet(type,id){state.sheet={type,id};renderSheet()}
function closeSheet(){state.sheet=null;$('sheet').hidden=true;$('sheet').innerHTML='';document.body.style.overflow='';renderMain()}
function renderSheet(){
 const sh=$('sheet'),s=state.sheet;if(!s){sh.hidden=true;return}
 sh.hidden=false;document.body.style.overflow='hidden';
 sh.innerHTML=(s.type==='form'?formHtml():detailHtml())+`<div class="kt-footer" style="margin-top:0;padding-bottom:90px"><div class="kt-pill"><img src="${KAIS_LOGO}" alt="KT"><span>POWERED BY KAIS</span></div></div>`;
 sh.scrollTop=0;
}

 return `<div class="head"><button data-act="closeSheet">${tr('رجوع','Back')}</button><h2>${d.id?tr('تعديل الحالة','Edit Case'):tr('إضافة حالة انتحال','Add Impersonation Case')}</h2></div><div class="body">
 <label for="f-type">${tr('نوع الحالة','Case Type')}</label><select id="f-type">${Object.keys(TYPES).map(k=>`<option value="${k}" ${(d.type||'profile')===k?'selected':''}>${typeInfo(k).t}</option>`).join('')}</select>

 <p class="hint" id="f-det"></p>
 <div class="row"><div><label for="f-pf">${tr('المنصة','Platform')}</label><select id="f-pf">${Object.keys(PLATFORMS).map(k=>`<option value="${k}" ${d.platform===k?'selected':''}>${pfName(k)}</option>`).join('')}</select></div>
 <div><label for="f-user" id="l-user">${T.l2}</label><input type="text" id="f-user" class="ltr" placeholder="${esc(T.ph2)}" value="${esc(d.username)}"></div></div>

 <input type="text" id="f-ref" class="ltr" placeholder="${tr('مثال: 1492837465','Example: 1492837465')}" value="${esc(d.refId||'')}">

function updDet(){
 const v=$('f-url').value.trim(),t=state.draft.type||'profile',det=$('f-det');

 if(t==='domain'){let h='';try{h=new URL(/^https?:\/\//i.test(v)?v:'https://'+v).hostname.replace(/^www\./,'')}catch{}
  state.draft.platform='website';$('f-pf').value='website';if(h)$('f-user').value=h;det.textContent=h?tr('النطاق: ','Domain: ')+h:'';return}
 const r=parseUrl(v);
 if(t==='profile'){state.draft.platform=r.platform;$('f-pf').value=r.platform;if(r.username)$('f-user').value=r.username;
  det.textContent=tr('تم التعرف: ','Detected: ')+pfName(r.platform)+(r.username?' — @'+r.username:'');return}
 if(r.platform!=='other'){state.draft.platform=r.platform;$('f-pf').value=r.platform;det.textContent=tr('المنصة: ','Platform: ')+pfName(r.platform)}else det.textContent='';
}

 else{c={id:uid(),type:d.type,url:d.url,platform:d.platform,username:d.username,refId:d.refId,notes:d.notes,shots:d.shots,status:'found',foundAt:Date.now(),reportedAt:null,updatedAt:Date.now(),log:[{at:Date.now(),t:tr('تم تسجيل الحالة','Case recorded')}]};state.cases.push(c)}

  const p=await Notification.requestPermission();
  if(p==='granted'){toast(tr('تم تفعيل إشعارات المتصفح','Browser notifications enabled'));checkAutoNotification();renderSettings()}
  else toast(tr('لم يتم منح إذن الإشعارات','Notification permission not granted'));
 },
 async copyCustomerLink(){
  const u=new URL(location.href.split('?')[0].split('#')[0]);
  u.searchParams.set('report','1');
  if(isEn())u.searchParams.set('lang','en');
  if(state.settings.brand)u.searchParams.set('brand',state.settings.brand);
  const cfg=Cloud.getConfig();
  if(cfg){u.searchParams.set('sb_url',cfg.url);u.searchParams.set('sb_key',cfg.key);u.searchParams.set('ws',cfg.workspace)}
  try{await navigator.clipboard.writeText(u.href);toast(tr('تم نسخ رابط نموذج العملاء','Customer form link copied'))}
  catch{prompt(tr('انسخ رابط نموذج العملاء:','Copy customer form link:'),u.href)}
 },
 previewCustomerForm(){
  state.customerMode=true;state.customerSubmitted=false;renderMain();window.scrollTo(0,0);
 },
 exitCustomerMode(){
  state.customerMode=false;renderMain();
 },
 resetCustomerForm(){
  state.customerSubmitted=false;
  state.custDraft={type:'profile',url:'',platform:'instagram',username:'',notes:'',contact:'',shots:[]};
  renderMain();
 },
 async submitCustomerReport(){
  const d=state.custDraft;
  d.type=$('cf-type').value;
  d.url=$('cf-url').value.trim();
  d.platform=$('cf-pf').value;
  d.username=$('cf-user').value.trim().replace(/^@/,'');
  d.notes=$('cf-notes').value.trim();
  d.contact=$('cf-contact').value.trim();
  if(!d.url&&!d.username){toast(tr('أدخل الرابط أو اسم الحساب المشبوه','Enter the suspicious link or username'));return}
  const parsed=parseUrl(d.url);
  if(parsed.platform!=='other')d.platform=parsed.platform;
  if(!d.username&&parsed.username)d.username=parsed.username;
  const c={
   id:uid(),type:d.type,url:d.url,platform:d.platform,username:d.username,refId:'',
   notes:d.notes,reporterContact:d.contact,shots:d.shots.slice(),
   source:'customer',status:'found',foundAt:Date.now(),reportedAt:null,updatedAt:Date.now(),
   log:[{at:Date.now(),t:tr('بلاغ وارد من عميل','Submitted via Customer Report')+(d.contact?' ('+d.contact+')':'')}]
  };
  state.cases.push(c);
  await DB.put('cases',c);
  await Cloud.pushCase(c).catch(()=>{});
  state.customerSubmitted=true;
  toast(tr('تم إرسال البلاغ','Report submitted'));
  renderMain();
 },
 async toggleVar(el){const v=el.dataset.v,i=state.checked.indexOf(v);if(i>=0)state.checked.splice(i,1);else state.checked.push(v);await DB.put('settings',{key:'checked',value:state.checked});el.closest('.var').classList.toggle('done',el.checked)},
 exportJSON(){download('hares-backup-'+new Date().toISOString().slice(0,10)+'.json','application/json',JSON.stringify({v:3,settings:state.settings,checked:state.checked,cases:state.cases}))},
 exportCSV(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',rows=[isEn()?['Type','Platform','Username / Number','URL','Ref ID','Status','Source','Detected Date','Reported Date','Registrar','Notes','Screenshots']:['النوع','المنصة','الاسم / الرقم','الرابط','رقم البلاغ','الحالة','المصدر','تاريخ الرصد','تاريخ البلاغ','مسجّل النطاق','ملاحظات','عدد الصور']];
  state.cases.forEach(c=>rows.push([typeInfo(typeOf(c)).t,pfName(c.platform),c.username,c.url,c.refId||'',stName(c.status),c.source==='customer'?tr('بلاغ عميل','Customer'):tr('داخلي','Internal'),fdate(c.foundAt),fdate(c.reportedAt),c.rdap?.registrar||'',c.notes,c.shots?.length||0]));
  download('hares-cases.csv','text/csv;charset=utf-8','\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n'))},
 importJSON(){if(!isOwner()){toast(tr('الاسترجاع متاح للمالك فقط','Restore is restricted to Owner'));return}$('importFile').click()},
 printCases(){
  const f=$('p-filter').value,list=state.cases.filter(c=>f==='all'||c.status===f);
  if(!list.length){toast(tr('لا توجد حسابات لهذه الحالة','No cases match this filter'));return}
  renderPrintDossier(list);
 },
 printSingleCase(){
  const c=state.cases.find(x=>x.id===state.sheet.id);if(!c)return;
  renderPrintDossier([c]);
 }
};

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;
 if(el.tagName==='INPUT'&&el.type==='checkbox'){actions[el.dataset.act]?.(el,e);return}
 actions[el.dataset.act]?.(el,e)});
document.addEventListener('input',e=>{
 if(e.target.id==='f-url')updDet();
 else if(e.target.id==='cf-url'){
  const r=parseUrl(e.target.value);
  if(r.platform!=='other'){$('cf-pf').value=r.platform;state.custDraft.platform=r.platform}
  if(r.username&&!$('cf-user').value){$('cf-user').value=r.username;state.custDraft.username=r.username}
 }
});
document.addEventListener('change',async e=>{
 const t=e.target;
 if(t.id==='f-pf')state.draft.platform=t.value;
 else if(t.id==='f-stamp')state.stampEvidence=t.checked;
 else if(t.id==='f-type'){const d=state.draft,ty=t.value;d.type=ty;
  if(ty==='domain')d.platform='website';else if(ty==='phone')d.platform='whatsapp';else if(['website','whatsapp'].includes(d.platform))d.platform='other';
  const T=typeInfo(ty);$('l-url').textContent=T.l1;$('l-user').textContent=T.l2;$('f-user').placeholder=T.ph2;$('f-pf').value=d.platform;updDet()}
 else if(t.id==='r-pf'||t.id==='r-lang'){state.reportPlatform=$('r-pf').value;state.reportLang=$('r-lang').value;const c=state.cases.find(x=>x.id===state.sheet.id);const rt=$('r-text');rt.dir=state.reportLang==='en'?'ltr':'rtl';rt.value=buildReport(c,state.reportPlatform,state.reportLang)}
 else if(t.id==='f-file'){
  const doStamp=$('f-stamp')?$('f-stamp').checked:state.stampEvidence;
  const target=($('f-user')?.value||$('f-url')?.value||'').trim();
  const stampInfo=doStamp?{target,brand:state.settings.brand||'Brand Guard'}:null;
  for(const f of t.files){try{state.draft.shots.push(await compress(f,stampInfo))}catch{toast(tr('تعذّر قراءة الصورة','Failed to read image'))}}
  t.value='';fillShots();
 }
 else if(t.id==='cf-file'){
  const target=($('cf-user')?.value||$('cf-url')?.value||'').trim();
  const stampInfo={target,brand:urlParams.get('brand')||state.settings.brand||'Brand Guard'};
  for(const f of t.files){try{state.custDraft.shots.push(await compress(f,stampInfo))}catch{toast(tr('تعذّر قراءة الصورة','Failed to read image'))}}
  t.value='';const s=$('cf-shots');if(s)s.innerHTML=shotsHtml(state.custDraft.shots,true,'delCustShot');
 }
 else if(t.id==='importFile'&&t.files[0]){try{const j=JSON.parse(await t.files[0].text());if(!Array.isArray(j.cases))throw 0;if(!confirm(tr('سيُدمج هذا الملف مع بياناتك الحالية. متابعة؟','Merge this backup file with your current records?')))return;
   for(const c of j.cases){if(!state.cases.find(x=>x.id===c.id))await DB.put('cases',c)}
   if(j.settings&&!state.settings.brand){await DB.put('settings',{key:'main',value:j.settings})}
   await reload();renderMain();toast(tr('تم الاسترجاع','Backup restored'))}catch{toast(tr('ملف غير صالح','Invalid backup file'))}t.value=''}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('lightbox').style.display==='flex')actions.closeLight();else if(state.sheet)actions.closeSheet()}});

/* ---------- PWA Service Worker ---------- */
if('serviceWorker' in navigator && /^https?:$/i.test(location.protocol)){
 window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}

/* ---------- start ---------- */
applyLangDir();
DB.open().then(reload).then(()=>{
 renderMain();
 checkAutoNotification();
 if(Cloud.getConfig())Cloud.syncAll(true).catch(()=>{});
}).catch(()=>{$('main').innerHTML=`<div class="empty"><b>${tr('تعذّر فتح التخزين','Storage Unavailable')}</b>${tr('افتح الملف من متصفح عادي وليس من وضع التصفح الخفي.','Please open the app in a standard browser window (not private/incognito mode).')}</div>`});
</script>
